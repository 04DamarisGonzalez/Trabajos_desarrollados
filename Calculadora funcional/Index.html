<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Damaris Gonzalez</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">

        <!-- Pantalla -->
        <input type="text" id="pantalla" disabled>

        <!-- Contenedor botones -->
        <div class="botones">

            <button class="operador limpiar">C</button>
            <button class="operador">÷</button>
            <button class="operador">×</button>
            <button class="operador">⌫</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operador">−</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operador">+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>

            <!-- Botón igual grande -->
            <button class="igual">=</button>

            <button>%</button>
            <button>0</button>
            <button>,</button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
